<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <title>漢字竜の探検隊</title>
  <defs>
    <linearGradient id="forest" x1="20" y1="10" x2="228" y2="254" gradientUnits="userSpaceOnUse">
